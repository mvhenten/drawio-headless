name: Release

# Builds cross-platform release binaries, attaches them to the GitHub Release
# for tag `v<version>`, then publishes the npm wrapper package.
#
# Triggered three ways:
#   - `workflow_call` from auto-release.yml with an explicit `version` input —
#     the primary path. auto-release.yml has already created and pushed the tag;
#     we just build and publish against it. (Calling directly avoids the
#     GITHUB_TOKEN tag-push not retriggering `on: push` workflows.)
#   - `push` of a `v*.*.*` tag — manual/legacy path (e.g. a hand-pushed tag).
#   - `workflow_dispatch` — smoke-test the build matrix without publishing
#     (no tag ⇒ release/npm jobs are skipped).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Version to release, without leading v (e.g. 0.2.0)."
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Resolve the version + tag once, from whichever trigger fired, so every
  # downstream job reads the same source of truth.
  setup:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - id: v
        shell: bash
        run: |
          set -eu
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev"
          fi
          # Whether to actually cut a release (GH Release + npm). True when
          # invoked via workflow_call or a tag push; false for a bare
          # workflow_dispatch smoke test.
          if [ -n "${{ inputs.version }}" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            release=true
          else
            release=false
          fi
          {
            echo "version=${version}"
            echo "tag=v${version}"
            echo "release=${release}"
          } >> "$GITHUB_OUTPUT"
          echo "resolved version=${version} release=${release}"

  build:
    name: build ${{ matrix.target }}
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            cross: false
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
            archive: zip
    steps:
      # Check out the tagged commit. On workflow_call the workflow ref is the
      # caller's branch (main); the tag was pushed first by auto-release.yml, so
      # building it gives the exact bumped/tagged tree.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (linux aarch64)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (native)
        if: ${{ matrix.cross == false }}
        shell: bash
        run: cargo build --release --bin drawio-headless --features rasterize --target ${{ matrix.target }}

      - name: Build (cross)
        if: ${{ matrix.cross == true }}
        shell: bash
        run: cross build --release --bin drawio-headless --features rasterize --target ${{ matrix.target }}

      - name: Strip binary (unix, native)
        if: ${{ matrix.archive == 'tar.gz' && matrix.cross == false }}
        shell: bash
        run: strip "target/${{ matrix.target }}/release/drawio-headless" || true

      - name: Stage artifact (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -eu
          version="$VERSION"
          stage="drawio-headless-${version}-${{ matrix.target }}"
          mkdir -p "dist/${stage}"
          cp "target/${{ matrix.target }}/release/drawio-headless" "dist/${stage}/drawio-headless"
          cp LICENSE "dist/${stage}/LICENSE"
          cp README.md "dist/${stage}/README.md"
          tar -czf "dist/${stage}.tar.gz" -C dist "${stage}"
          (cd dist && shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256")
          echo "ASSET=dist/${stage}.tar.gz" >> "$GITHUB_ENV"
          echo "SHA=dist/${stage}.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Stage artifact (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          $version = $env:VERSION
          $stage = "drawio-headless-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/drawio-headless.exe" "dist/$stage/drawio-headless.exe"
          Copy-Item "LICENSE" "dist/$stage/LICENSE"
          Copy-Item "README.md" "dist/$stage/README.md"
          Compress-Archive -Path "dist/$stage/*" -DestinationPath "dist/$stage.zip"
          $hash = (Get-FileHash "dist/$stage.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $stage.zip" | Out-File -Encoding ascii "dist/$stage.zip.sha256"
          "ASSET=dist/$stage.zip"        | Out-File -Encoding ascii -Append $env:GITHUB_ENV
          "SHA=dist/$stage.zip.sha256"   | Out-File -Encoding ascii -Append $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: drawio-headless-${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.SHA }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [setup, build]
    if: needs.setup.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded assets
        run: ls -la dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Pin the tag explicitly: on workflow_call github.ref is the caller's
          # branch, not the tag, so the default ref-based tag would be wrong.
          tag_name: ${{ needs.setup.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

  publish-npm:
    name: Publish npm package
    needs: [setup, release]
    if: needs.setup.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Sync npm package version to tag
        working-directory: npm
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -eu
          node -e "const fs=require('fs');const p=require('./package.json');p.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
          head -5 package.json

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Skip publish (no NPM_TOKEN)
        if: ${{ env.NPM_TOKEN == '' }}
        run: |
          echo "NPM_TOKEN secret not configured on this repo; skipping npm publish."
          echo "Set the NPM_TOKEN secret to enable automatic publishing on tag push."

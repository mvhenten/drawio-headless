[workspace]
resolver = "3"
members = [
    "crates/author",
    "crates/render",
    "crates/cli",
    "crates/closed-loop-test",
    "crates/examples",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/mvhenten/drawio-headless"

[workspace.dependencies]
quick-xml = "0.36"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
flate2 = "1"
percent-encoding = "2"
drawio-author = { path = "crates/author" }
drawio-render = { path = "crates/render" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
